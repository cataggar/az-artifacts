[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "az-artifacts"
version = "0.1.0"
description = "Native Python discovery, metadata, inspection, downloads, and publishing for Azure DevOps Universal Packages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "az-artifacts contributors" }]
dependencies = [
    "httpx>=0.28.1,<1",
    "wcmatch>=10.1,<11",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
azure-identity = ["azure-identity>=1.19,<2"]

[project.urls]
Homepage = "https://github.com/cataggar/az-artifacts"
Issues = "https://github.com/cataggar/az-artifacts/issues"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/az_artifacts"]
