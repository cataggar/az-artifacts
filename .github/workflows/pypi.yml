name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UV_NO_PROGRESS: "1"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    name: Validate tag and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install uv with ghr
        uses: cataggar/ghr/actions/install@114926d37d3825e63bede2ccc7ce56b67eda7495
        with:
          ghr-version: v0.8.0
          tools: astral-sh/uv@0.12.15
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Python
        run: uv python install "3.14"
      - name: Sync locked dependencies
        run: uv sync --locked --group dev --python "3.14"
      - name: Require tag to match project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              project = tomllib.load(stream)["project"]
          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} does not match project version {expected!r}")
          print(f"Building {project['name']} {project['version']} from {actual}")
          PY
      - name: Test
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke test wheel and source distribution
        run: |
          uv venv --python "3.14" .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python -I -c "from az_artifacts import UniversalPackageClient; from importlib.metadata import version; print(version('az-artifacts'))"
          uv venv --python "3.14" .sdist-smoke
          uv pip install --python .sdist-smoke/bin/python dist/*.tar.gz
          .sdist-smoke/bin/python -I -c "from az_artifacts import UniversalPackageClient; from importlib.metadata import version; print(version('az-artifacts'))"
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/az-artifacts
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
